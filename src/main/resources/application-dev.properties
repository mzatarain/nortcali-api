# ─── Perfil: DEV ─────────────────────────────────────────────────────────────
# Configuración para desarrollo local.
# Las credenciales se cargan desde env.properties (no versionado).
# ─────────────────────────────────────────────────────────────────────────────

# Credenciales locales — definidas en env.properties (ver CLAUDE.md)
spring.config.import=file:env.properties

# Base de datos MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_DATABASE}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# SQL visible en consola para debugging
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging — nivel DEBUG para el paquete de la app
logging.level.com.nortcali=DEBUG
