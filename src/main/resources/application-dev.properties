# ─── Perfil: DEV ─────────────────────────────────────────────────────────────
# Configuración para desarrollo local.
# Las credenciales se cargan desde env.properties (no versionado).
# ─────────────────────────────────────────────────────────────────────────────

# Base de datos MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_DATABASE}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# SQL visible en consola para debugging
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging — nivel DEBUG para el paquete de la app
logging.level.com.nortcali=DEBUG

# CORS
cors.allowed-origins=http://localhost:5173

# Stripe — Fase 3 del plan SaaS. STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET viven en
# env.properties (no versionado), igual que JWT_SECRET/DB_PASSWORD. Usar siempre las
# llaves de test (sk_test_.../whsec_...) en este perfil.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
# IDs de precio de la cuenta "NortCali" en modo test (dashboard.stripe.com/test/products)
stripe.prices.basico=${STRIPE_PRICE_BASICO:price_1UCnn7J7gw4BVDFwcmHPkxfP}
stripe.prices.pro=${STRIPE_PRICE_PRO:price_1UCnnAJ7gw4BVDFwozfDzq2C}
stripe.prices.enterprise=${STRIPE_PRICE_ENTERPRISE:price_1UCnnDJ7gw4BVDFwUGtHAc70}

# URL del frontend — usada para construir success_url/cancel_url del Checkout y el
# return_url del Billing Portal
app.frontend-url=http://localhost:5173

# Email transaccional — Fase 5 del plan SaaS. AWS SES vía SMTP (no el SDK de AWS): usuario y
# password se generan en la consola SES ("SMTP Settings" → "Create SMTP credentials"), son
# distintos de las llaves de acceso IAM. email.enabled=false por default en dev porque todavía
# no existe una cuenta SES configurada — el código queda listo pero no intenta conectarse hasta
# que se activa explícitamente (ver EMAIL_ENABLED en env.properties).
email.enabled=${EMAIL_ENABLED:false}
email.from=${EMAIL_FROM:no-reply@nortcali.com}
spring.mail.host=${SES_SMTP_HOST:email-smtp.us-east-1.amazonaws.com}
spring.mail.port=${SES_SMTP_PORT:587}
spring.mail.username=${SES_SMTP_USERNAME:}
spring.mail.password=${SES_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true