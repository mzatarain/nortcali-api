# ─── Perfil: PROD ────────────────────────────────────────────────────────────
# PENDIENTE — Configurar cuando el ambiente de producción esté listo.
#
# Variables de entorno requeridas en el servidor de despliegue:
#   DB_HOST      → host del servidor MySQL
#   DB_PORT      → puerto MySQL (default: 3306)
#   DB_DATABASE  → nombre de la base de datos
#   DB_USER      → usuario de MySQL
#   DB_PASSWORD  → contraseña de MySQL
#   JWT_SECRET   → secreto JWT (mínimo 64 caracteres, generado aleatoriamente)
#
# Activar perfil:
#   java -jar nortcali-api.jar --spring.profiles.active=prod
#   o: export SPRING_PROFILES_ACTIVE=prod
# ─────────────────────────────────────────────────────────────────────────────
# ─── Perfil: PROD ────────────────────────────────────────────────────────────

# AWS Secrets Manager
spring.cloud.aws.secretsmanager.enabled=true
spring.cloud.aws.region.static=us-east-1

# Base de datos — credenciales desde Secrets Manager
spring.datasource.url=jdbc:mysql://${nortcali/rds/credentials/host}:${nortcali/rds/credentials/port}/${nortcali/rds/credentials/dbname}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${nortcali/rds/credentials/username}
spring.datasource.password=${nortcali/rds/credentials/password}

# SQL oculto en producción
spring.jpa.show-sql=false

# JWT
jwt.secret=${nortcali/rds/credentials/jwt_secret}
jwt.expiration=28800000

# Deshabilitar devtools en producción
spring.devtools.restart.enabled=false

# Swagger/OpenAPI deshabilitado en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.nortcali=INFO

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGIN}