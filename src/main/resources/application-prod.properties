# ─── Perfil: PROD ────────────────────────────────────────────────────────────
# Variables de entorno inyectadas por Ansible desde Secrets Manager:
#   DB_HOST      → host RDS
#   DB_PORT      → puerto MySQL (default: 3306)
#   DB_NAME      → nombre de la base de datos
#   DB_USERNAME  → usuario de MySQL
#   DB_PASSWORD  → contraseña de MySQL
#   JWT_SECRET   → secreto JWT
#   CORS_ALLOWED_ORIGIN → orígenes permitidos, separados por coma (app + landing)
#   APP_FRONTEND_URL    → URL única del panel, ej. https://app.nortcali.com (Stripe redirects)
#   STRIPE_SECRET_KEY   → sk_live_... (o restricted rk_live_...)
#   STRIPE_WEBHOOK_SECRET → whsec_... del endpoint LIVE /api/v1/billing/webhook
#   STRIPE_PRICE_BASICO / STRIPE_PRICE_PRO / STRIPE_PRICE_ENTERPRISE → price ids LIVE
#   EMAIL_FROM, SES_SMTP_HOST, SES_SMTP_PORT, SES_SMTP_USERNAME, SES_SMTP_PASSWORD → email (SES)
# StripeConfig falla el arranque si las variables de Stripe no son de modo LIVE.
# ─────────────────────────────────────────────────────────────────────────────

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# SQL oculto en producción
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=28800000

# Deshabilitar devtools en producción
spring.devtools.restart.enabled=false

# Swagger/OpenAPI deshabilitado en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# IP real del cliente detrás del Nginx del EC2 frontend (proxy /api/ → backend). Ese Nginx
# agrega la IP real como último elemento de X-Forwarded-For y Tomcat (RemoteIpValve) solo
# confía en proxies de red interna (10/8, 172.16/12…), así que un X-Forwarded-For falsificado
# por el cliente queda a la izquierda y se ignora. Sin esto getRemoteAddr() devuelve la IP del
# proxy: el rate limiter de login/registro compartía un solo contador para todos los usuarios
# y sessions/legal_acceptances guardaban la IP del proxy.
server.forward-headers-strategy=native

# Logging
logging.level.root=WARN
logging.level.com.nortcali=INFO

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGIN}

# Stripe — Fase 3 del plan SaaS. Inyectadas por Ansible desde Secrets Manager, igual que
# JWT_SECRET. STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET deben ser las llaves LIVE
# (sk_live_.../whsec_...) — nunca las de test en este perfil.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.prices.basico=${STRIPE_PRICE_BASICO}
stripe.prices.pro=${STRIPE_PRICE_PRO}
stripe.prices.enterprise=${STRIPE_PRICE_ENTERPRISE}

# URL del panel (nortcali-management) — base de success_url/cancel_url del Checkout y return_url
# del Billing Portal. Variable propia (no CORS_ALLOWED_ORIGIN): CORS acepta una lista separada por
# comas (app + landing) y reutilizarla aquí rompería las URLs de Stripe. StripeConfig valida que
# sea un único origen https sin '/' final.
app.frontend-url=${APP_FRONTEND_URL}

# Email transaccional — Fase 5 del plan SaaS. AWS SES vía SMTP. SES_SMTP_USERNAME/PASSWORD son
# credenciales SMTP (consola SES → "SMTP Settings"), no las llaves de acceso IAM. Inyectadas por
# Ansible desde Secrets Manager, igual que STRIPE_SECRET_KEY. EMAIL_FROM debe ser una identidad
# verificada en SES (dominio o dirección) antes de poner email.enabled=true.
email.enabled=${EMAIL_ENABLED:true}
email.from=${EMAIL_FROM}
spring.mail.host=${SES_SMTP_HOST}
spring.mail.port=${SES_SMTP_PORT:587}
spring.mail.username=${SES_SMTP_USERNAME}
spring.mail.password=${SES_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true