# ─── Perfil: PROD ────────────────────────────────────────────────────────────
# Variables de entorno inyectadas por Ansible desde Secrets Manager:
#   DB_HOST      → host RDS
#   DB_PORT      → puerto MySQL (default: 3306)
#   DB_NAME      → nombre de la base de datos
#   DB_USERNAME  → usuario de MySQL
#   DB_PASSWORD  → contraseña de MySQL
#   JWT_SECRET   → secreto JWT
#   CORS_ALLOWED_ORIGIN → dominio del frontend
# ─────────────────────────────────────────────────────────────────────────────

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# SQL oculto en producción
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=28800000

# Deshabilitar devtools en producción
spring.devtools.restart.enabled=false

# Swagger/OpenAPI deshabilitado en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.nortcali=INFO

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGIN}

# Stripe — Fase 3 del plan SaaS. Inyectadas por Ansible desde Secrets Manager, igual que
# JWT_SECRET. STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET deben ser las llaves LIVE
# (sk_live_.../whsec_...) — nunca las de test en este perfil.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.prices.basico=${STRIPE_PRICE_BASICO}
stripe.prices.pro=${STRIPE_PRICE_PRO}
stripe.prices.enterprise=${STRIPE_PRICE_ENTERPRISE}

# URL del frontend — reutiliza el mismo dominio que ya se whitelistea en CORS
app.frontend-url=${CORS_ALLOWED_ORIGIN}

# Email transaccional — Fase 5 del plan SaaS. AWS SES vía SMTP. SES_SMTP_USERNAME/PASSWORD son
# credenciales SMTP (consola SES → "SMTP Settings"), no las llaves de acceso IAM. Inyectadas por
# Ansible desde Secrets Manager, igual que STRIPE_SECRET_KEY. EMAIL_FROM debe ser una identidad
# verificada en SES (dominio o dirección) antes de poner email.enabled=true.
email.enabled=${EMAIL_ENABLED:true}
email.from=${EMAIL_FROM}
spring.mail.host=${SES_SMTP_HOST}
spring.mail.port=${SES_SMTP_PORT:587}
spring.mail.username=${SES_SMTP_USERNAME}
spring.mail.password=${SES_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true