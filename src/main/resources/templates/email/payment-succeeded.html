<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#16a34a;padding:24px 32px;">
              <span style="color:#ffffff;font-size:20px;font-weight:bold;">NortCali</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#18181b;">
              <p style="font-size:18px;margin:0 0 16px;">Pago recibido ✓</p>
              <p style="font-size:14px;line-height:1.6;margin:0 0 16px;">
                Confirmamos el pago de <strong th:text="${amount}">$0.00 MXN</strong> del plan
                <strong th:text="${planLabel}">Plan</strong> para <strong th:text="${tenantName}">Negocio</strong>.
                Tu suscripción sigue activa sin interrupciones.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;" th:if="${hostedInvoiceUrl}">
                <tr>
                  <td style="background-color:#16a34a;border-radius:6px;">
                    <a th:href="${hostedInvoiceUrl}" style="display:inline-block;padding:12px 24px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:bold;">
                      Ver recibo
                    </a>
                  </td>
                </tr>
              </table>
              <p style="font-size:13px;color:#71717a;line-height:1.6;margin:0;">
                Puedes administrar tu facturación en cualquier momento desde
                Configuración &gt; Facturación dentro del panel.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
