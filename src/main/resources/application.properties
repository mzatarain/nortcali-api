spring.application.name=nortcali-api

# Perfil activo por defecto. Para producción sobreescribir con:
#   -Dspring.profiles.active=prod   (CLI)
#   SPRING_PROFILES_ACTIVE=prod     (variable de entorno)
spring.profiles.active=dev

# Puerto del servidor (aplica a todos los perfiles salvo que se sobreescriba)
server.port=8082

# Zona horaria — fuerza UTC en Jackson, Hibernate y en la sesión MySQL sin importar
# la zona del servidor ni el perfil activo.
# connectionInitSql garantiza SET SESSION time_zone='+00:00' en cada conexión del pool,
# independientemente de si forceConnectionTimeZoneToSession=true está en la JDBC URL del perfil.
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connectionInitSql=SET SESSION time_zone='+00:00'

# JPA — Hibernate solo valida el schema, nunca lo modifica
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
