# ── Base de datos H2 en memoria (reemplaza MySQL para tests) ──────────────────
spring.datasource.url=jdbc:h2:mem:nortcali_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea el schema desde las entidades; no valida contra MySQL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Deshabilitar la importación del env.properties externo
spring.config.import=

# Variables sustituidas en application.properties
APP_NAME=nortcali-api-test
DB_DATABASE=nortcali_test
DB_USER=sa
DB_PASSWORD=

# JWT — secreto de al menos 32 chars para tests
jwt.secret=testSecretKeyForJwtTokenMinimum32Chars
jwt.expiration=3600000

# Suprimir warning de Logback antes de que Spring configure el contexto de logging
logging.level.org.jboss.logging=WARN

# CORS — requerido por CorsConfig (@Value)
cors.allowed-origins=http://localhost:5173
