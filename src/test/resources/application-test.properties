# ── Base de datos H2 en memoria (reemplaza MySQL para tests) ──────────────────
spring.datasource.url=jdbc:h2:mem:nortcali_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea el schema desde las entidades; no valida contra MySQL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# H2 no soporta la sintaxis "SET SESSION time_zone=..." de MySQL usada en
# spring.datasource.hikari.connectionInitSql (application.properties) — se anula aquí
spring.datasource.hikari.connectionInitSql=

# Deshabilitar la importación del env.properties externo
spring.config.import=

# Variables sustituidas en application.properties
APP_NAME=nortcali-api-test
DB_DATABASE=nortcali_test
DB_USER=sa
DB_PASSWORD=

# JWT — secreto de al menos 32 chars para tests
jwt.secret=testSecretKeyForJwtTokenMinimum32Chars
jwt.expiration=3600000

# Suprimir warning de Logback antes de que Spring configure el contexto de logging
logging.level.org.jboss.logging=WARN

# CORS — requerido por CorsConfig (@Value)
cors.allowed-origins=http://localhost:5173

# Rate limit de login relajado — los tests de integración hacen múltiples logins desde la
# misma IP simulada de MockMvc y superarían el límite de 5/min pensado para producción
auth.login-rate-limit.capacity=10000

# Stripe — Fase 3 (plan SaaS). Placeholders: ningún test dispara una llamada real a Stripe,
# pero StripeConfig/BillingServiceImpl usan @Value — sin estas properties el contexto de
# Spring no levanta (placeholder no resoluble)
stripe.secret-key=sk_test_placeholder
stripe.webhook-secret=whsec_test_placeholder
stripe.prices.basico=price_test_basico
stripe.prices.pro=price_test_pro
stripe.prices.enterprise=price_test_enterprise
app.frontend-url=http://localhost:5173
