services:

  # ─── MySQL 8.4 ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: nortcali-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Persistencia de datos entre reinicios
      - mysql_data:/var/lib/mysql
      # Scripts de inicialización — se ejecutan solo en la primera vez (DB vacía)
      - ./src/main/resources/db:/docker-entrypoint-initdb.d:ro
    ports:
      # Exponer solo en desarrollo; en producción eliminar o restringir a 127.0.0.1
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── NortCali API ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nortcali-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    volumes:
      # Persistencia de logs del perfil prod
      - api_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  api_logs:
    driver: local
